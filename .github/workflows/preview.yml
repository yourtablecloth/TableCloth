name: TableCloth Preview Pipeline

# 이슈 #296: 미리 보기(Preview) 링 전용 파이프라인. 리테일 build.yml 과 격리되어 있으며,
# v*-preview.* 태그에서만 동작한다. Native AOT 로 x64+arm64 를 게시하고 preview-<arch> 채널 +
# "-Preview" 자산명 + GitHub 프리릴리스(draft)로 만든다. 서명은 리테일과 동일하게 로컬 단계에서
# 수행한다(SimplySign 은 로컬 전용). 설계: docs/RELEASE_CHANNELS.md.

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
    - 'v*-preview.*'

jobs:
  validate-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate version core matches tag
      run: |
        # v1.21.0-preview.1 → 1.21.0-preview.1 → core 1.21.0
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        CORE_VERSION="${TAG_VERSION%%-preview*}"

        VERSION_MAJOR=$(grep -oP '(?<=<TableClothVersionMajor>)[^<]+' Directory.Build.Props)
        VERSION_MINOR=$(grep -oP '(?<=<TableClothVersionMinor>)[^<]+' Directory.Build.Props)
        VERSION_PATCH=$(grep -oP '(?<=<TableClothVersionPatch>)[^<]+' Directory.Build.Props)
        PROPS_VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"

        echo "Tag: $TAG_VERSION (core $CORE_VERSION)  Props: $PROPS_VERSION"
        if [ "$CORE_VERSION" != "$PROPS_VERSION" ]; then
          echo "::error::Preview tag core ($CORE_VERSION) does not match Directory.Build.Props ($PROPS_VERSION)."
          exit 1
        fi
      shell: bash

  build:
    needs: [validate-version]
    strategy:
      matrix:
        platform: [x64, arm64]
        include:
          - platform: x64
            runner: windows-latest
          - platform: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      Spork_Project_Path: src\Spork\Spork.csproj
      TableCloth_Project_Path: src\TableCloth\TableCloth.csproj
      Spork_Test_Project_Path: src\Spork.Test\Spork.Test.csproj
      TableCloth_Test_Project_Path: src\TableCloth.Test\TableCloth.Test.csproj
      Platform: ${{ matrix.platform }}
      # 게시 경로는 build.cs 가 기대하는 레이아웃을 그대로 쓴다. 로컬 x64 PC 가 이 산출물을 그대로
      # 내려받아 `build.cmd --skip-build --sign --preview` 로 서명 패키징할 수 있게 하기 위함이다
      # (arm64 AOT 는 로컬에서 빌드할 수 없다). 자세한 절차는 docs/RELEASING.md §8.
      TableClothPublishDir: publish\Release\win-${{ matrix.platform }}
      SporkPublishDir: publish\spork\Release\win-${{ matrix.platform }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install Velopack CLI
      run: dotnet tool install -g vpk

    - name: Run tests (Spork.Test)
      run: dotnet test $env:Spork_Test_Project_Path -c Release

    - name: Run tests (TableCloth.Test)
      run: dotnet test $env:TableCloth_Test_Project_Path -c Release

    # Native AOT 게시 — 진입점 csproj 가 RID 지정 시 PublishAot(+크기 세트)를 자동 활성화한다.
    # (WPF 전용 PublishSingleFile/ReadyToRun 플래그를 넘기지 않는다 — AOT 와 상호배타.)
    - name: Publish TableCloth (NativeAOT)
      run: dotnet publish $env:TableCloth_Project_Path -r win-${{ env.Platform }} -c Release -o $env:TableClothPublishDir

    - name: Compute version
      id: ver
      run: |
        # 4-part 파일 버전은 게시된 exe 에서, SemVer2 프리릴리스는 태그에서.
        $full = (Get-Item "$env:TableClothPublishDir\TableCloth.exe").VersionInfo.FileVersion
        $sem = "${{ github.ref_name }}".TrimStart('v')   # 1.21.0-preview.1
        echo "FULL=$full" >> $env:GITHUB_OUTPUT
        echo "SEMVER=$sem" >> $env:GITHUB_OUTPUT
        Write-Host "FULL=$full  SEMVER=$sem"
      shell: pwsh

    - name: Collect TableCloth symbols
      run: |
        New-Item -ItemType Directory -Force symbols\tablecloth | Out-Null
        Get-ChildItem $env:TableClothPublishDir -Filter *.pdb -ErrorAction SilentlyContinue | Move-Item -Destination symbols\tablecloth -Force
      shell: pwsh

    - name: Create Velopack package (TableCloth, preview)
      run: |
        vpk pack `
          --packId TableCloth `
          --packVersion ${{ steps.ver.outputs.SEMVER }} `
          --packDir $env:TableClothPublishDir `
          --mainExe TableCloth.exe `
          --channel preview-${{ env.Platform }} `
          --outputDir releases
      shell: pwsh

    - name: Rename TableCloth outputs (-Preview)
      run: |
        $prefix = "TableCloth-Preview_${{ steps.ver.outputs.FULL }}_Release_${{ env.Platform }}"
        Move-Item -LiteralPath "releases\TableCloth-preview-${{ env.Platform }}-Setup.exe" -Destination "releases\$prefix.exe"
        Move-Item -LiteralPath "releases\TableCloth-preview-${{ env.Platform }}-Portable.zip" -Destination "releases\${prefix}_Portable.zip"
        Write-Host "Renamed -> $prefix.exe / ${prefix}_Portable.zip"
      shell: pwsh

    - name: Publish Spork (NativeAOT)
      run: dotnet publish $env:Spork_Project_Path -r win-${{ env.Platform }} -c Release -o $env:SporkPublishDir

    - name: Collect Spork symbols
      run: |
        New-Item -ItemType Directory -Force symbols\spork | Out-Null
        Get-ChildItem $env:SporkPublishDir -Filter *.pdb -ErrorAction SilentlyContinue | Move-Item -Destination symbols\spork -Force
      shell: pwsh

    - name: Create Velopack package (Spork, preview)
      run: |
        vpk pack `
          --packId Spork `
          --packVersion ${{ steps.ver.outputs.SEMVER }} `
          --packDir $env:SporkPublishDir `
          --mainExe Spork.exe `
          --channel spork-preview-${{ env.Platform }} `
          --outputDir releases
      shell: pwsh

    - name: Rename Spork outputs (-Preview)
      run: |
        $prefix = "Spork-Preview_${{ steps.ver.outputs.FULL }}_Release_${{ env.Platform }}"
        Move-Item -LiteralPath "releases\Spork-spork-preview-${{ env.Platform }}-Setup.exe" -Destination "releases\$prefix.exe"
        Move-Item -LiteralPath "releases\Spork-spork-preview-${{ env.Platform }}-Portable.zip" -Destination "releases\${prefix}_Portable.zip"
        Write-Host "Renamed -> $prefix.exe / ${prefix}_Portable.zip"
      shell: pwsh

    - name: Package symbols (symbols.zip)
      run: |
        $zip = "releases\TableCloth-Preview_${{ steps.ver.outputs.FULL }}_${{ env.Platform }}_symbols.zip"
        Compress-Archive -Path symbols\* -DestinationPath $zip -Force
        Write-Host "Created $zip"
      shell: pwsh

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Preview-${{ matrix.platform }}
        path: "releases/*"
        if-no-files-found: error
        retention-days: 5

    # 로컬 서명용 인계 자산(docs/RELEASING.md §8). pack 이전의 게시 산출물을 그대로 넘겨,
    # x64 개발 PC 가 `build.cmd --skip-build --sign --preview` 로 다시 pack 하면서 서명할 수 있게 한다.
    # 서명·패키징은 아키텍처 중립이라(§3-1) arm64 페이로드도 x64 에서 패키징된다 — 로컬에서 못 하는 것은
    # arm64 AOT '빌드'뿐이다. 심볼 수집 단계 뒤에 올리므로 대용량 AOT pdb 는 포함되지 않는다.
    - name: Upload publish payload (for local signing)
      uses: actions/upload-artifact@v4
      with:
        name: PublishPayload-${{ matrix.platform }}
        path: "publish/**"
        if-no-files-found: error
        retention-days: 5

  create-release:
    needs: [validate-version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 릴리스 자산만 받는다. PublishPayload-* (로컬 서명 인계용 게시 산출물)는 수백 MB 이고
    # 릴리스에 올리지 않으므로 여기서 받지 않는다.
    - name: Download release artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: Preview-*
        path: artifacts

    - name: Organize release assets
      run: |
        mkdir -p release-assets
        for arch in x64 arm64; do
          if [ -d "artifacts/Preview-$arch" ]; then
            cp artifacts/Preview-$arch/* release-assets/
            echo "Copied $arch preview assets"
          fi
        done
        ls -la release-assets/
      shell: bash

    # 프리릴리스(draft) 생성 — draft 로 만들고 로컬 서명·업로드 후 사람이 Publish 한다.
    # prerelease=true 라 게시 시 'released' 가 아닌 'prereleased' 이벤트가 발생 → winget/discord 미발동.
    - name: Create GitHub prerelease (draft)
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        prerelease: true
        generate_release_notes: true
        files: release-assets/*
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepend UNSIGNED marker + preview banner
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        existing=$(gh release view "$TAG" --json body --jq .body)
        prefix=$(cat <<'EOF'
        > [!WARNING]
        > **UNSIGNED — DO NOT PUBLISH**
        >
        > Preview .exe assets are not yet code-signed. Sign them locally (SimplySign) and re-upload
        > before publishing this prerelease.

        > [!NOTE]
        > **미리 보기(Preview) 빌드** — 새 기능과 변경 사항을 정식(안정) 출시보다 먼저 검증하는 선행 릴리스입니다.
        > 실험적이라 불안정할 수 있으며, 앱 옵션의 **업데이트 채널 → 미리 보기**로 옵트인한 사용자에게 제공됩니다.
        > 미리 보기 버전으로 올라간 뒤에는 안정 버전을 다시 설치해야 이전 버전으로 되돌릴 수 있습니다.

        EOF
        )
        printf '%s\n%s' "$prefix" "$existing" | gh release edit "$TAG" --notes-file -
      shell: bash
